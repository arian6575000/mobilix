name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: MobilixApp
        run: npm install --legacy-peer-deps
      - name: Generate icons (only creates missing files)
        working-directory: MobilixApp
        run: node scripts/make-icons.mjs
      - name: Typecheck
        working-directory: MobilixApp
        run: npx tsc --noEmit
      - name: Tests
        working-directory: MobilixApp
        run: npm test
      - name: Generate native Android project
        working-directory: MobilixApp
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: MobilixApp/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"
      - uses: actions/upload-artifact@v4
        with:
          name: Mobilix-apk
          path: MobilixApp/android/app/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mobilix APK #${{ github.run_number }}
          files: MobilixApp/android/app/build/outputs/apk/release/*.apk
